name: Diagnose installer SpellChecker payload

on:
  push:
    branches: [main]
    paths: [.github/workflows/bootstrap-release.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect installer archives without executing them
        run: |
          set -euo pipefail
          mkdir -p /tmp/hippo-installers
          cd /tmp/hippo-installers
          for file in hippou200.exe hippo200.exe hippo64_200.exe; do
            echo "=== $file ==="
            status=$(curl --silent --show-error --location --retry 3 \
              --user-agent 'HippoEDIT-GitHub-Actions/1.0' \
              --output "$file" --write-out '%{http_code}' \
              "https://www.hippoedit.com/download/$file" || true)
            echo "HTTP=$status"
            test "$status" = 200
            ls -l "$file"
            sha256sum "$file"
            file "$file"
            echo '--- SpellChecker archive entries ---'
            7z l -ba "$file" | grep -i -E 'spell.?checker|spellchecker' || true
          done
