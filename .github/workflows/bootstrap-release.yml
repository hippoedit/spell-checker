name: Bootstrap SpellChecker 2.0.86 release

on:
  push:
    branches: [main]
    paths:
      - package-info.xml
      - .github/workflows/bootstrap-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout distribution metadata
        uses: actions/checkout@v4

      - name: Build and publish verified canonical release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version='2.0.86'
          tag="v${version}"
          asset="spell-checker-${version}.zip"
          plugin_id='CE3B04B4-AD3F-4827-A629-4C5149C4DAA4'

          grep -Fq "<id>${plugin_id}</id>" package-info.xml
          grep -Fq "<version>${version}</version>" package-info.xml
          grep -Fq "<required>${version}</required>" package-info.xml

          rm -rf .release-stage .release-verify .installers "$asset"
          mkdir -p .release-stage/x32u .release-stage/x64 .release-verify .installers
          cp package-info.xml .release-stage/package-info.xml

          import_variant() {
            installer="$1"
            installer_sha256="$2"
            variant="$3"
            dll_sha256="$4"

            curl --fail --silent --show-error --location --retry 3 \
              --user-agent 'HippoEDIT-GitHub-Actions/1.0' \
              "https://www.hippoedit.com/download/${installer}" \
              --output ".installers/${installer}"

            actual_installer=$(sha256sum ".installers/${installer}" | awk '{print $1}')
            test "$actual_installer" = "$installer_sha256"

            7z e -y -o".installers/${variant}" ".installers/${installer}" 'plugins/SpellChecker.dll' >/dev/null
            test -f ".installers/${variant}/SpellChecker.dll"
            cp ".installers/${variant}/SpellChecker.dll" ".release-stage/${variant}/SpellChecker.dll"

            actual_dll=$(sha256sum ".release-stage/${variant}/SpellChecker.dll" | awk '{print $1}')
            test "$actual_dll" = "$dll_sha256"

            strings -a ".release-stage/${variant}/SpellChecker.dll" | grep -Fq "{${plugin_id}}"
            strings -a -el ".release-stage/${variant}/SpellChecker.dll" > ".installers/${variant}-utf16.txt"
            grep -Fxq "$version" ".installers/${variant}-utf16.txt"
          }

          import_variant \
            hippou200.exe \
            85834ed84e56428bb95d387323fd2394a46c36150ba22d8a8b7cd760e13e1b6d \
            x32u \
            5777f1f4b034ce0afd6574618315cd1755d3fd0ced10a1ddd403a835beefd600

          import_variant \
            hippo64_200.exe \
            9b2dccf98fd3bf2fcf6be0111bed58af959dcfac36088367c1ac53a1fd98d2cd \
            x64 \
            60e42d84656f8a283205343feae800a161c4593bafea6f1e8e5933b3a1ada9ae

          test "$(find .release-stage -type f | wc -l)" = '3'
          find .release-stage -type f -exec touch -t 198001010000.00 {} +
          (cd .release-stage && find . -type f -printf '%P\n' | LC_ALL=C sort | zip -X "../${asset}" -@ >/dev/null)
          unzip -t "$asset"
          digest=$(sha256sum "$asset" | awk '{print $1}')
          echo "Canonical release SHA256=${digest}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release download "$tag" --pattern "$asset" --dir .release-verify
            cmp "$asset" ".release-verify/$asset"
          else
            gh release create "$tag" "$asset" \
              --target "$GITHUB_SHA" \
              --title "Spell Checker ${version}" \
              --notes "Canonical HippoEDIT Spell Checker ${version} distribution, extracted from and byte-verified against the accepted HippoEDIT ${version} Unicode x86/x64 installers."
            gh release download "$tag" --pattern "$asset" --dir .release-verify
            cmp "$asset" ".release-verify/$asset"
          fi
