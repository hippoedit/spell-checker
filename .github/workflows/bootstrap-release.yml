name: Diagnose live SpellChecker publication

on:
  push:
    branches: [main]
    paths: [.github/workflows/bootstrap-release.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect bounded live markup
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            --user-agent 'HippoEDIT-GitHub-Actions/1.0' \
            'https://www.hippoedit.com/plugins.php?lang=en' \
            --output /tmp/plugins.html
          python3 - /tmp/plugins.html <<'PY'
          from pathlib import Path
          import re
          import sys

          text = Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          matches = list(re.finditer(r'Spell Checker', text, re.I))
          print(f'Spell Checker occurrences: {len(matches)}')
          for index, match in enumerate(matches, 1):
              start = max(0, match.start() - 700)
              end = min(len(text), match.end() + 1400)
              context = re.sub(r'\s+', ' ', text[start:end])
              print(f'--- occurrence {index} at {match.start()} ---')
              print(context)
          if not matches:
              raise SystemExit('Spell Checker marker missing')
          PY
