name: Diagnose current SpellChecker versions

on:
  push:
    branches: [main]
    paths: [.github/workflows/bootstrap-release.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Read PE version resources from current installer binaries
        run: |
          set -euo pipefail
          mkdir -p /tmp/hippo-installers
          cd /tmp/hippo-installers
          for spec in \
            'hippou200.exe:85834ed84e56428bb95d387323fd2394a46c36150ba22d8a8b7cd760e13e1b6d:x32u' \
            'hippo64_200.exe:9b2dccf98fd3bf2fcf6be0111bed58af959dcfac36088367c1ac53a1fd98d2cd:x64'
          do
            IFS=: read -r file expected variant <<<"$spec"
            curl --fail --silent --show-error --location --retry 3 \
              --user-agent 'HippoEDIT-GitHub-Actions/1.0' \
              "https://www.hippoedit.com/download/$file" --output "$file"
            test "$(sha256sum "$file" | awk '{print $1}')" = "$expected"
            mkdir -p "$variant"
            7z e -y -o"$variant" "$file" 'plugins/SpellChecker.dll' >/dev/null
            echo "=== $variant ==="
            strings -a -el "$variant/SpellChecker.dll" > "$variant/utf16.txt"
            grep -n -A4 -B2 -E 'FileVersion|ProductVersion|FileDescription|ProductName' "$variant/utf16.txt" || true
          done
