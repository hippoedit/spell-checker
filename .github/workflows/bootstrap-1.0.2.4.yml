name: Bootstrap SpellChecker 1.0.2.4

on:
  push:
    branches: [main]
    paths:
      - package-info.xml
      - bootstrap/1.0.2.4.json
      - .github/workflows/bootstrap-1.0.2.4.yml

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.repository == 'hippoedit/spell-checker' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout distribution metadata
        uses: actions/checkout@v4

      - name: Import and verify legacy payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          manifest=bootstrap/1.0.2.4.json
          version=$(jq -r '.version' "$manifest")
          tag=$(jq -r '.tag' "$manifest")
          asset=$(jq -r '.asset' "$manifest")
          plugin_id=$(jq -r '.plugin_id' "$manifest")

          test "$(jq -r '.schema' "$manifest")" = '1'
          test "$version" = '1.0.2.4'
          test "$tag" = 'v1.0.2.4'
          test "$asset" = 'spell-checker-1.0.2.4.zip'
          grep -Fq "<id>${plugin_id}</id>" package-info.xml
          grep -Fq "<version>${version}</version>" package-info.xml

          rm -rf .release-stage .release-verify .legacy-bundles "$asset"
          mkdir -p .release-stage .release-verify .legacy-bundles
          cp package-info.xml .release-stage/package-info.xml

          plugin_page=''
          for candidate in \
            'https://www.hippoedit.com/plugins.php?lang=en' \
            'https://hippoedit.com/plugins.php?lang=en' \
            'https://html-editor.hippoedit.com/plugins.php?lang=en'
          do
            status=$(curl --silent --show-error --location --retry 2 \
              --user-agent 'HippoEDIT-GitHub-Actions/1.0' \
              --output .legacy-bundles/plugins.html --write-out '%{http_code}' "$candidate" || true)
            echo "Plugin page probe: $candidate -> $status"
            if [ "$status" = '200' ] && grep -Fq 'Spell Checker' .legacy-bundles/plugins.html; then
              plugin_page="$candidate"
              break
            fi
          done
          test -n "$plugin_page"

          bundle_href=$(python3 - .legacy-bundles/plugins.html <<'PY'
          import html
          from pathlib import Path
          import re
          import sys

          text = Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          marker = text.find('Spell Checker')
          if marker < 0:
              raise SystemExit('Spell Checker marker missing')
          window = text[max(0, marker - 2500):marker + 5000]
          matches = re.findall(r'href=["\']([^"\']*get_bundle\.php[^"\']*type=plugin[^"\']*)["\']', window, re.I)
          if not matches:
              raise SystemExit('Unable to find Spell Checker bundle href near marker')
          print(html.unescape(matches[-1]))
          PY
          )
          echo "Spell Checker bundle href: $bundle_href"

          bundle_url=$(python3 - "$plugin_page" "$bundle_href" <<'PY'
          from urllib.parse import urljoin
          import sys
          print(urljoin(sys.argv[1], sys.argv[2]))
          PY
          )
          echo "Resolved bundle URL: $bundle_url"

          resolved_id=$(python3 - "$bundle_url" <<'PY'
          from urllib.parse import parse_qs, urlparse
          import sys
          print(parse_qs(urlparse(sys.argv[1]).query).get('id', [''])[0])
          PY
          )
          test "$resolved_id" = "$plugin_id"

          jq -c '.files | to_entries[]' "$manifest" |
          while IFS= read -r item; do
            target=$(jq -r '.key' <<<"$item")
            architecture=$(jq -r '.value.architecture' <<<"$item")
            unicode=$(jq -r '.value.unicode' <<<"$item")
            pdb=$(jq -r '.value.pdb' <<<"$item")
            entry=$(jq -r '.value.entry' <<<"$item")
            expected=$(jq -r '.value.blob_sha' <<<"$item")
            [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
            [[ "$target" != /* && "$target" != *".."* ]]

            bundle=".legacy-bundles/$(echo "$target" | tr '/' '_').hebundle"
            curl --fail --silent --show-error --location --retry 3 \
              --user-agent 'HippoEDIT-GitHub-Actions/1.0' \
              --get "$bundle_url" \
              --data-urlencode "architecture=$architecture" \
              --data-urlencode "unicode=$unicode" \
              --data-urlencode "pdb=$pdb" \
              --output "$bundle"
            unzip -t "$bundle"

            mkdir -p ".release-stage/$(dirname "$target")"
            unzip -p "$bundle" "$entry" > ".release-stage/$target"
            test -s ".release-stage/$target"

            actual=$(python3 - ".release-stage/$target" <<'PY'
          from hashlib import sha1
          from pathlib import Path
          import sys
          data = Path(sys.argv[1]).read_bytes()
          print(sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest())
          PY
            )
            if [ "$actual" != "$expected" ]; then
              echo "Legacy payload mismatch for $target: $actual != $expected" >&2
              exit 1
            fi
          done

          test "$(find .release-stage -type f | wc -l)" = '7'
          find .release-stage -type f -exec touch -t 198001010000.00 {} +
          (cd .release-stage && find . -type f -printf '%P\n' | LC_ALL=C sort | zip -X "../$asset" -@ >/dev/null)
          unzip -t "$asset"
          sha256sum "$asset"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release download "$tag" --pattern "$asset" --dir .release-verify
            cmp "$asset" ".release-verify/$asset"
          else
            gh release create "$tag" "$asset" \
              --target "$GITHUB_SHA" \
              --title "Spell Checker $version" \
              --notes "Bootstrap of HippoEDIT Spell Checker $version from the live supported plugin bundle contract. Payload bytes are verified against hippoedit/website@1fcab5602e8f06bfd3c87d5ea7a441956f74c8ee Git blob SHAs; PDB archive filename case is normalized to package-info.xml."
            gh release download "$tag" --pattern "$asset" --dir .release-verify
            cmp "$asset" ".release-verify/$asset"
          fi

          echo 'Canonical release asset:'
          sha256sum "$asset"
